spring.application.name=toeic-api

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/toeic_ai_learning}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:TuanDat0608}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

app.password-reset.frontend-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.password-reset.token-ttl=${PASSWORD_RESET_TOKEN_TTL:PT30M}
app.mail.from=${MAIL_FROM:no-reply@toeic-ai.local}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
app.auth.bootstrap-admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.auth.bootstrap-admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.auth.bootstrap-admin-name=${BOOTSTRAP_ADMIN_NAME:}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
