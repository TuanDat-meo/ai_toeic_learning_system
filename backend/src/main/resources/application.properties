spring.application.name=toeic-api

spring.flyway.enabled=true
spring.flyway.out-of-order=true
spring.jpa.hibernate.ddl-auto=validate

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/toeic_ai_learning}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:TuanDat0608}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

app.password-reset.token-ttl=${PASSWORD_RESET_TOKEN_TTL:PT2M}
app.mail.from=${MAIL_FROM:no-reply@toeic-ai.local}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
grammar.ai.provider=${GRAMMAR_AI_PROVIDER:ollama}
grammar.ai.ollama.base-url=${GRAMMAR_OLLAMA_URL:http://localhost:11434}
grammar.ai.ollama.model=${GRAMMAR_OLLAMA_MODEL:qwen2.5:3b}
app.auth.bootstrap-admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.auth.bootstrap-admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.auth.bootstrap-admin-name=${BOOTSTRAP_ADMIN_NAME:}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.payment.vietqr.bank-code=${VIETQR_BANK_CODE:}
app.payment.vietqr.account-number=${VIETQR_ACCOUNT_NUMBER:}
app.payment.vietqr.account-name=${VIETQR_ACCOUNT_NAME:}
app.payment.sepay.webhook-token=${SEPAY_WEBHOOK_TOKEN:}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.servlet.multipart.max-file-size=256MB
spring.servlet.multipart.max-request-size=260MB

app.content-import.storage.region=${AWS_REGION:us-east-1}
app.content-import.storage.bucket=${CONTENT_IMPORT_S3_BUCKET:}
app.content-import.storage.public-base-url=${CONTENT_IMPORT_S3_PUBLIC_BASE_URL:}
app.content-import.ocr-url=${PADDLE_OCR_URL:http://localhost:8001}

# OAuth redirect-uri uses {baseUrl}; honor the public HTTPS host forwarded by the deployment proxy.
server.forward-headers-strategy=framework
