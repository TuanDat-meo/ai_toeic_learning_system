name: ai_toeic_learning_system

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: toeic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-toeic_ai_learning}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT_BIND:-5433:5432}"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    image: ai_toeic_learning_system-backend:latest
    container_name: toeic-backend
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/toeic_ai_learning}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}"
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "${BACKEND_PORT_BIND:-8080:8080}"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    image: ai_toeic_learning_system-frontend:latest
    container_name: toeic-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT_BIND:-3000:3000}"
    depends_on:
      - backend
    volumes:
      - type: bind
        source: ${MEDIA_DIR:-./frontend/public}/audio
        target: /app/public/audio
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_DIR:-./frontend/public}/ets_2024_lc
        target: /app/public/ets_2024_lc
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_DIR:-./frontend/public}/ets_2024_lc1
        target: /app/public/ets_2024_lc1
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_DIR:-./frontend/public}/ets_lc1
        target: /app/public/ets_lc1
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_DIR:-./frontend/public}/ets_rc1
        target: /app/public/ets_rc1
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_DIR:-./frontend/public}/ets_transcript1
        target: /app/public/ets_transcript1
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_DIR:-./frontend/public}/images
        target: /app/public/images
        read_only: true
        bind:
          create_host_path: false

volumes:
  pgdata:
    external: true
    name: toeic_ai_learning_pgdata